<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>Nabz | Voice Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #292044 0%, #141521 48%, #0c0e14 100%);
      color: #f6f3ff; font-family: system-ui, sans-serif;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .brand { font-size: 14px; color: #c8b6ff; letter-spacing: 2px; }
    .orb-wrap {
      width: 180px; height: 180px; margin: 34px auto;
      display: grid; place-items: center; position: relative;
    }
    .ring {
      position: absolute; inset: 0; border: 1px solid #a98aff55;
      border-radius: 50%; animation: breathe 3s ease-in-out infinite;
    }
    .ring:nth-child(2) { inset: 13px; animation-delay: .5s; }
    .orb {
      width: 105px; height: 105px; border-radius: 50%;
      background: radial-gradient(circle at 32% 25%, #eee4ff, #b18aff 24%, #7651d6 58%, #271746);
      box-shadow: 0 0 45px #9565ff88, inset -8px -10px 25px #1d123c;
      animation: pulse 3s ease-in-out infinite;
    }
    h1 { font-size: 32px; margin: 8px 0 12px; }
    p { color: #bcb9cc; line-height: 1.9; margin: 8px 0; }
    .tag {
      display: inline-block; border: 1px solid #ffffff18;
      background: #ffffff08; border-radius: 30px;
      padding: 8px 14px; color: #d4c5ff; font-size: 13px;
    }
    button {
      width: 100%; border: 0; border-radius: 16px; padding: 16px;
      margin-top: 24px; color: white; font-size: 16px; font-weight: 700;
      background: linear-gradient(110deg, #9867f5, #6840c8);
      box-shadow: 0 8px 28px #7950d944; cursor: pointer;
    }
    button:active { transform: scale(.98); }
    #status { min-height: 28px; font-size: 13px; margin-top: 14px; }
    .features {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-top: 30px;
    }
    .feature {
      padding: 13px 5px; border: 1px solid #ffffff12;
      background: #ffffff08; border-radius: 14px;
      color: #d7d1e8; font-size: 12px; line-height: 1.7;
    }
    .feature span { display: block; font-size: 21px; margin-bottom: 5px; }
    .lang { margin-top: 24px; font-size: 12px; color: #858198; }
    @keyframes pulse { 50% { transform: scale(1.07); } }
    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .35; }
      50% { transform: scale(1.06); opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" id="brand">نبض</div>
    <div class="tag" id="tag">دستیار صوتی هوشمند</div>

    <div class="orb-wrap" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb"></div>
    </div>

    <h1 id="heading">صدات رو می‌شنوم</h1>
    <p id="subtitle">با نبض صحبت کن؛ تجربه‌ای ساده و هوشمند.</p>

    <button id="start" type="button">🎙 شروع گفت‌وگو</button>
    <p id="status" role="status">برای شروع، روی دکمه بزن.</p>

    <div class="features">
      <div class="feature"><span>🎙</span><b id="f1">گفت‌وگوی صوتی</b></div>
      <div class="feature"><span>🧠</span><b id="f2">پاسخ هوشمند</b></div>
      <div class="feature"><span>⚡</span><b id="f3">ساده و سریع</b></div>
    </div>

    <div class="lang" id="langLabel">فارسی</div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(window.location.search);
    const requested = params.get("lang");
    const telegramLang = tg?.initDataUnsafe?.user?.language_code || "fa";
    const lang = ["fa", "en"].includes(requested)
      ? requested
      : (telegramLang.toLowerCase().startsWith("en") ? "en" : "fa");

    const t = {
      fa: {
        brand: "نبض", tag: "دستیار صوتی هوشمند",
        heading: "صدات رو می‌شنوم",
        subtitle: "با نبض صحبت کن؛ تجربه‌ای ساده و هوشمند.",
        start: "🎙 شروع گفت‌وگو",
        status: "برای شروع، روی دکمه بزن.",
        clicked: "قابلیت گفت‌وگوی صوتی هنوز متصل نشده است.",
        f1: "گفت‌وگوی صوتی", f2: "پاسخ هوشمند",
        f3: "ساده و سریع", langLabel: "فارسی",
        dir: "rtl"
      },
      en: {
        brand: "NABZ", tag: "SMART VOICE ASSISTANT",
        heading: "I'm listening",
        subtitle: "Talk to Nabz for a simple, intelligent experience.",
        start: "🎙 Start Conversation",
        status: "Tap the button to get started.",
        clicked: "Voice conversation is not connected yet.",
        f1: "Voice Chat", f2: "Smart Answers",
        f3: "Simple & Fast", langLabel: "English",
        dir: "ltr"
      }
    };

    const x = t[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = x.dir;
    document.title = lang === "fa" ? "نبض | دستیار صوتی" : "Nabz | Voice Assistant";

    for (const id of ["brand", "tag", "heading", "subtitle", "start",
                      "status", "f1", "f2", "f3", "langLabel"]) {
      const el = document.getElementById(id);
      if (el) el.textContent = x[id];
    }

    const startButton = document.getElementById("start");
    const statusEl = document.getElementById("status");

    const replyEl = document.createElement("p");
    replyEl.id = "reply";
    replyEl.style.cssText =
      "white-space:pre-wrap;overflow-wrap:anywhere;margin-top:18px;color:#eee7ff";
    statusEl.insertAdjacentElement("afterend", replyEl);

    let recorder = null;
    let chunks = [];
    let recording = false;
    let stream = null;

    const messages = {
      fa: {
        ready: "برای صحبت، روی دکمه بزن.",
        recording: "دارم گوش می‌دم… برای پایان ضبط دوباره بزن.",
        processing: "صدات رسید؛ دارم فکر می‌کنم…",
        noTelegram: "نبض رو از داخل تلگرام باز کن.",
        noMic: "دسترسی به میکروفون ممکن نیست. مجوز میکروفون رو بررسی کن.",
        empty: "صدایی ضبط نشد؛ دوباره امتحان کن.",
        failed: "ارتباط برقرار نشد؛ دوباره امتحان کن.",
        stop: "⏹ پایان ضبط",
        start: "🎙 شروع گفت‌وگو",
        transcript: "تو گفتی: ",
        answer: "نبض: "
      },
      en: {
        ready: "Tap the button to speak.",
        recording: "Listening… Tap again to finish recording.",
        processing: "Audio received. Thinking…",
        noTelegram: "Open Nabz from inside Telegram.",
        noMic: "Microphone access failed. Check microphone permissions.",
        empty: "No audio was recorded. Please try again.",
        failed: "Connection failed. Please try again.",
        stop: "⏹ Stop recording",
        start: "🎙 Start Conversation",
        transcript: "You said: ",
        answer: "Nabz: "
      }
    };
    const m = messages[lang];

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const trimmed = text.trim();

      if (/[\u0600-\u06FF]/.test(trimmed)) {
        utterance.lang = /[\u0750-\u077F]/.test(trimmed) ? "ar-SA" : "fa-IR";
      } else if (/[\u0400-\u04FF]/.test(trimmed)) {
        utterance.lang = "ru-RU";
      } else if (/[\u4E00-\u9FFF]/.test(trimmed)) {
        utterance.lang = "zh-CN";
      } else if (/[\u3040-\u30FF]/.test(trimmed)) {
        utterance.lang = "ja-JP";
      } else if (/[\uAC00-\uD7AF]/.test(trimmed)) {
        utterance.lang = "ko-KR";
      } else if (/[\u0E00-\u0E7F]/.test(trimmed)) {
        utterance.lang = "th-TH";
      } else if (/[\u0900-\u097F]/.test(trimmed)) {
        utterance.lang = "hi-IN";
      } else if (/[\u0A80-\u0AFF]/.test(trimmed)) {
        utterance.lang = "gu-IN";
      } else if (/[\u0B80-\u0BFF]/.test(trimmed)) {
        utterance.lang = "ta-IN";
      } else if (/[\u0C00-\u0C7F]/.test(trimmed)) {
        utterance.lang = "te-IN";
      } else if (/[\u0D00-\u0D7F]/.test(trimmed)) {
        utterance.lang = "ml-IN";
      } else if (/[\u0980-\u09FF]/.test(trimmed)) {
        utterance.lang = "bn-IN";
      } else if (/[\u0B00-\u0B7F]/.test(trimmed)) {
        utterance.lang = "or-IN";
      } else if (/[\u0C80-\u0CFF]/.test(trimmed)) {
        utterance.lang = "kn-IN";
      } else if (/[\u0D80-\u0DFF]/.test(trimmed)) {
        utterance.lang = "si-LK";
      } else if (/[\u0E80-\u0EFF]/.test(trimmed)) {
        utterance.lang = "lo-LA";
      } else if (/[\u1780-\u17FF]/.test(trimmed)) {
        utterance.lang = "km-KH";
      } else if (/[\u1000-\u109F]/.test(trimmed)) {
        utterance.lang = "my-MM";
      } else if (/[\u10A0-\u10FF]/.test(trimmed)) {
        utterance.lang = "ka-GE";
      } else if (/[\u0530-\u058F]/.test(trimmed)) {
        utterance.lang = "hy-AM";
      } else if (/[\u0590-\u05FF]/.test(trimmed)) {
        utterance.lang = "he-IL";
      } else if (/[\u0600-\u06FF]/.test(trimmed)) {
        utterance.lang = "ar-SA";
      } else if (/[\u0F00-\u0FFF]/.test(trimmed)) {
        utterance.lang = "bo-CN";
      } else if (/[\u1200-\u137F]/.test(trimmed)) {
        utterance.lang = "am-ET";
      } else if (/[\u13A0-\u13FF]/.test(trimmed)) {
        utterance.lang = "chr-US";
      } else if (/[\u1400-\u167F]/.test(trimmed)) {
        utterance.lang = "iu-CA";
      } else if (/[\u1680-\u169F]/.test(trimmed)) {
        utterance.lang = "oj-CA";
      } else if (/[\u16A0-\u16FF]/.test(trimmed)) {
        utterance.lang = "rw-RW";
      } else if (/[\u1780-\u17FF]/.test(trimmed)) {
        utterance.lang = "km-KH";
      } else if (/[\u1800-\u18AF]/.test(trimmed)) {
        utterance.lang = "mn-MN";
      } else if (/[\u1E00-\u1EFF]/.test(trimmed)) {
        utterance.lang = "vi-VN";
      } else if (/[\u3040-\u30FF]/.test(trimmed)) {
        utterance.lang = "ja-JP";
      } else if (/[\u0E00-\u0E7F]/.test(trimmed)) {
        utterance.lang = "th-TH";
      } else if (/[\u0400-\u04FF]/.test(trimmed)) {
        utterance.lang = "ru-RU";
      } else if (/[\u0590-\u05FF]/.test(trimmed)) {
        utterance.lang = "he-IL";
      } else if (/[\u0600-\u06FF]/.test(trimmed)) {
        utterance.lang = "ar-SA";
      } else if (/[\u00C0-\u024F]/.test(trimmed)) {
        utterance.lang = "en-US";
      } else {
        utterance.lang = "en-US";
      }

      window.speechSynthesis.speak(utterance);
    }

    async function uploadAudio(blob) {
      if (!tg?.initData) {
        statusEl.textContent = m.noTelegram;
        return;
      }

      const form = new FormData();
      const extension = blob.type.includes("ogg") ? "ogg" : "webm";
      form.append("audio", blob, `recording.${extension}`);

      try {
        const response = await fetch("/api/voice", {
          method: "POST",
          headers: { "X-Telegram-Init-Data": tg.initData },
          body: form
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || m.failed);

        replyEl.textContent =
          m.transcript + data.transcript + "\n\n" + m.answer + data.answer;
        statusEl.textContent = "";
        speak(data.answer);
      } catch (error) {
        statusEl.textContent = error.message || m.failed;
      } finally {
        startButton.disabled = false;
        startButton.textContent = m.start;
      }
    }

    async function startRecording() {
      if (!tg?.initData) {
        statusEl.textContent = m.noTelegram;
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        statusEl.textContent = lang === "fa"
          ? "مرورگر این دستگاه ضبط صدا را پشتیبانی نمی‌کند."
          : "Audio recording is not supported by this browser.";
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const preferredTypes = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus"
        ];
        const mimeType = preferredTypes.find(
          type => MediaRecorder.isTypeSupported(type)
        );
        recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        chunks = [];
        recorder.ondataavailable = event => {
          if (event.data?.size) chunks.push(event.data);
        };

        recorder.onstop = async () => {
          stream?.getTracks().forEach(track => track.stop());
          stream = null;
          recording = false;

          const blob = new Blob(chunks, {
            type: recorder.mimeType || "audio/webm"
          });
          if (!blob.size) {
            statusEl.textContent = m.empty;
            startButton.disabled = false;
            startButton.textContent = m.start;
            return;
          }

          statusEl.textContent = m.processing;
          await uploadAudio(blob);
        };

        recorder.start();
        recording = true;
        startButton.textContent = m.stop;
        statusEl.textContent = m.recording;
      } catch (_error) {
        stream?.getTracks().forEach(track => track.stop());
        stream = null;
        statusEl.textContent = m.noMic;
      }
    }

    startButton.addEventListener("click", () => {
      if (recording && recorder?.state === "recording") {
        recorder.stop();
        startButton.disabled = true;
        startButton.textContent = lang === "fa" ? "در حال ارسال…" : "Sending…";
      } else {
        replyEl.textContent = "";
        startRecording();
      }
    });
  </script>
</body>
</html>
