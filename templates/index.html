<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nabz Voice</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131a;
      color: #f4f5f7;
      font-family: sans-serif;
    }
    main { text-align: center; padding: 24px; }
    .orb {
      width: 112px;
      height: 112px;
      margin: 24px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9ee7ff, #4766d8 55%, #171c46);
      box-shadow: 0 0 45px #4766d866;
    }
    p { color: #bdc3d1; line-height: 1.9; }
  </style>
</head>
<body>
  <main>
    <div class="orb"></div>
    <h1>نبض</h1>
    <p>دستیار صوتی نبض</p>
    <p id="status">صفحه با موفقیت بارگذاری شد.</p>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      document.getElementById("status").textContent =
        "Mini App آماده است؛ اتصال صوتی هنوز راه‌اندازی نشده.";
    }
  </script>
</body>
</html>
