<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10091f">
<title>NABZ | نبض</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
background:radial-gradient(ellipse at 50% 35%,#422267 0%,#211333 38%,#10091f 76%);
color:#fff;font-family:system-ui,sans-serif;text-align:center}
main{width:min(100%,430px)}
.brand{font-size:13px;letter-spacing:5px;color:#d8c2ff}
h1{font-size:48px;margin:10px 0 4px}
.sub{color:#c7b7da;font-size:15px}
.heart{width:150px;height:150px;margin:34px auto;display:grid;place-items:center;
border-radius:50%;font-size:54px;color:#fff;
background:radial-gradient(circle at 35% 30%,#edc4ff,#a15ce4 42%,#432461 75%);
box-shadow:0 0 28px #bd78ff88,inset 0 0 22px #fff3;
animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 52px #ce8affaa,inset 0 0 30px #fff5}}
.text{color:#e2d5f0;line-height:2;font-size:14px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:15px;
font-size:16px;font-weight:700;color:#1b0d2a;
background:linear-gradient(100deg,#b78aff,#f0a3ed);cursor:pointer}
.en{direction:ltr;color:#a99ab9;font-size:12px;line-height:1.8;margin-top:15px}
footer{font-size:10px;letter-spacing:2px;color:#9581ae;margin-top:45px}
</style>
</head>
<body>
<main>
<div class="brand">N A B Z</div>
<h1>نبض</h1>
<div class="sub">هم‌صدا با فکر تو</div>
<div class="heart">♥</div>
<div class="text">گاهی فقط کافیه شروع کنی.<br>نبض اینجاست تا بهت گوش بده.</div>
<button onclick="location.href='https://nabz-miniapp-new.onrender.com/'">
ورود به نبض
</button>
<div class="en">Your space to speak, think, and be heard.</div>
<footer>OWNERSHIP : @nstrncnii</footer>
</main>
</body>
</html>
